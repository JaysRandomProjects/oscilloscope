<!-- AUDIO -->
<div class="section hidden" id="sec-audio">
  <h3>Audio Input</h3>
  <div class="file-drop" id="fileDrop">Click or Drag & Drop audio file here…</div>
  <input type="file" id="audioFile" accept="audio/*" style="display:none">

  <div class="field" id="audioDimensionField">
    <div class="field-row"><span>Audio Display</span></div>
    <div class="toggle-row">
      <div class="toggle-btn active" data-audiodim="1d">1D Waveform</div>
      <div class="toggle-btn" data-audiodim="2d">2D XY</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn primary" id="btnPlay">▶ Play</button>
    <button class="btn" id="btnPause">‖ Pause</button>
    <button class="btn danger" id="btnStop">■ Stop</button>
  </div>

  <div class="field">
    <div class="field-row">
      <span>Seek</span>
      <span class="val" id="v-seek">0:00 / 0:00</span>
    </div>
    <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
  </div>

  <div class="field">
    <div class="field-row">
      <span>Volume</span>
      <span class="val" id="v-volume">80%</span>
    </div>
    <input type="range" id="volume" min="0" max="100" step="1" value="80">
  </div>
</div>
